# Configuration for the tests only. Deployments use wrangler.toml.
name = "diserver-test"
main = "src/index.ts"
compatibility_date = "2026-10-15"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "diserver-test"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "UPDATES"
id = "00000000000000000000000000000000"
